<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Drive Text Editor</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
</head>

<body>
  <header>
    <button id="explorerToggle" type="button" aria-controls="fileExplorer" aria-expanded="true">[=]</button>
    <span class="app-title">DRIVE.EDIT</span>
    <button id="saveButton" disabled>[S] SAVE</button>
    <button id="settingsButton">[G] SETTINGS</button>
  </header>

  <div class="workspace">
    <aside id="fileExplorer" aria-label="Google Drive file explorer">
      <div class="explorer-title">FILE EXPLORER</div>
      <div class="explorer-actions">
        <button id="explorerNewFileButton" type="button" disabled>+ FILE</button>
        <button id="explorerNewFolderButton" type="button" disabled>+ FOLDER</button>
        <button id="explorerRefreshButton" type="button" disabled>REFRESH</button>
      </div>
      <div id="explorerTree" role="tree" aria-label="My Drive">
        <div class="explorer-message">SELECT REFRESH TO CONNECT TO DRIVE</div>
      </div>
    </aside>

    <section class="editor-pane">
      <div class="tabs-bar">
        <nav id="tabs" aria-label="Open files" role="tablist"></nav>
        <button id="newTabButton" type="button" disabled aria-label="New tab" title="New tab">+</button>
      </div>
      <div class="editor-surface">
        <main id="editor"></main>
        <div id="editorState" class="editor-state" role="status" aria-live="polite" aria-atomic="true" hidden>
          <span id="editorStateSymbol" class="editor-state-symbol" aria-hidden="true"></span>
          <span id="editorStateMessage">LOADING FILE</span>
        </div>
      </div>
    </section>
  </div>
  <footer>
    <span id="filename">NO FILE</span>
    <span id="status" role="status" aria-live="polite">READY</span>
    <span id="cursorPosition" class="footer-cell">LN --, COL --</span>
    <span id="documentStats" class="footer-cell">0 LINES | 0 WORDS | 0 CHARS | 0 B</span>
  </footer>

  <dialog id="settingsDialog" aria-labelledby="settingsTitle">
    <div class="settings-titlebar">
      <h2 id="settingsTitle">SETTINGS</h2>
      <button id="closeSettingsButton" type="button" aria-label="Close settings">X</button>
    </div>
    <div class="settings-layout">
      <nav class="settings-sections" aria-label="Settings sections">
        <button type="button" class="settings-section selected" aria-current="page">
          APPEARANCE
        </button>
      </nav>
      <section class="settings-panel" aria-labelledby="appearanceTitle">
        <h3 id="appearanceTitle">APPEARANCE</h3>

        <div class="setting-row">
          <span class="setting-label">COLOR MODE</span>
          <label class="segmented-toggle">
            <input id="darkModeToggle" type="checkbox">
            <span class="light-option">LIGHT</span>
            <span class="dark-option">DARK</span>
          </label>
        </div>

        <div class="setting-row">
          <label class="setting-label" for="followSystemToggle">FOLLOW SYSTEM</label>
          <input id="followSystemToggle" class="box-checkbox" type="checkbox">
        </div>

        <div class="setting-row stacked">
          <label class="setting-label" for="uiFontSelect">UI FONT</label>
          <select id="uiFontSelect"></select>
        </div>

        <div class="setting-row stacked">
          <label class="setting-label" for="uiFontSizeSelect">UI FONT SIZE</label>
          <select id="uiFontSizeSelect"></select>
        </div>

        <div class="setting-row stacked">
          <label class="setting-label" for="editorFontSelect">EDITOR FONT</label>
          <select id="editorFontSelect"></select>
        </div>

        <div class="setting-row stacked">
          <label class="setting-label" for="editorFontSizeSelect">EDITOR FONT SIZE</label>
          <select id="editorFontSizeSelect"></select>
        </div>

        <div class="setting-row stacked">
          <label class="setting-label" for="darkThemeSelect">DARK THEME</label>
          <select id="darkThemeSelect"></select>
        </div>

        <div class="setting-row stacked">
          <label class="setting-label" for="lightThemeSelect">LIGHT THEME</label>
          <select id="lightThemeSelect"></select>
        </div>
      </section>
    </div>
  </dialog>

  <dialog id="recoveryDialog" aria-labelledby="recoveryTitle">
    <div class="settings-titlebar">
      <h2 id="recoveryTitle">RECOVERY DRAFTS</h2>
      <button id="closeRecoveryButton" type="button" aria-label="Close recovery drafts">X</button>
    </div>
    <div class="recovery-panel">
      <p>UNSAVED WORK WAS FOUND IN THIS BROWSER.</p>
      <div id="recoveryList"></div>
    </div>
  </dialog>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
