<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Drive Text Editor</title>
  <link rel="stylesheet" href="/styles.css">

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://apis.google.com/js/api.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
</head>

<body>
  <header>
    <span class="app-title">DRIVE.EDIT</span>
    <button id="newButton" disabled>[N] NEW</button>
    <button id="openButton" disabled>[O] OPEN</button>
    <button id="saveButton" disabled>[S] SAVE</button>
  </header>

  <nav id="tabs" aria-label="Open files" role="tablist"></nav>
  <main id="editor"></main>
  <footer>
    <span id="filename">NO FILE</span>
    <span id="status">READY</span>
  </footer>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
